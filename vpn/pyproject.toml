[project]
name = "vpn-agent"
version = "0.1.0"
description = "Privileged agent that reconciles a WireGuard interface on a single VPN exit server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<0.142",
    # Pinned explicitly — see backend/pyproject.toml for the CVE list this resolves
    # (PYSEC-2026-161/248/249/1941/1942/2280/2281). Verified via the full test suite.
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
