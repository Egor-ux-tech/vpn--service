name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: pytest
        run: python -m pytest -q --cov=app --cov-report=term-missing

      - name: pip-audit (dependency vulnerability scan)
        run: pip install pip-audit && pip-audit --strict --skip-editable

  postgres:
    # Everything in `test` runs on SQLite for speed and can't catch dialect-specific
    # migration/transaction bugs — production only ever runs Postgres (see
    # docker-compose.yml, which pins the same postgres:16-alpine image used here). See
    # tests/postgres/ for what this actually exercises: migrations against a genuinely
    # empty database, the unique-constraint fix for the IP-allocation race, real
    # commit/rollback/SAVEPOINT behavior.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpnservice
          POSTGRES_PASSWORD: vpnservice
          POSTGRES_DB: vpnservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnservice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest against real PostgreSQL
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://vpnservice:vpnservice@localhost:5432/vpnservice_test
        run: python -m pytest tests/postgres -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infrastructure/docker/backend.Dockerfile -t vpn-service-backend:ci ./backend
