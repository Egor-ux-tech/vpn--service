name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` performs full TypeScript type-checking as part of its own pipeline
      # (confirmed: its output includes a "Running TypeScript" step) — a standalone `tsc
      # --noEmit` run before this would fail regardless of code correctness, since
      # Next.js's generated route types (.next/types) don't exist until a build has run
      # at least once. No separate type-check step is needed.
      - name: Build (includes type-checking)
        run: npm run build

      - name: npm audit (dependency vulnerability scan)
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f infrastructure/docker/frontend.Dockerfile -t vpn-service-frontend:ci ./frontend
