global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:8801"]
        labels:
          service: bot

  # vpn-agent instances run on the exit servers themselves, one per server, provisioned by
  # the Ansible wireguard role — add one static target per server here, or replace this
  # block with file_sd_configs / a service-discovery mechanism once the fleet grows past a
  # handful of manually-managed entries. See docs/deployment.md.
  - job_name: vpn-agent
    metrics_path: /metrics
    static_configs:
      - targets: []
        labels:
          service: vpn-agent

  # Host-level CPU/RAM/network/disk for each VPN exit server — deployed by the same
  # Ansible role that installs the vpn-agent (infrastructure/ansible/roles/wireguard).
  - job_name: node
    static_configs:
      - targets: []
        labels:
          service: vpn-server-host
