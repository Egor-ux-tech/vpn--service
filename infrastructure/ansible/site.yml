---
# Provisions a VPN exit server end to end: WireGuard interface + firewall/NAT, the
# vpn-agent control service, and node_exporter for host metrics. Run against a fresh
# Ubuntu 22.04+ host: `ansible-playbook -i inventory/hosts.ini site.yml`.
#
# This playbook does NOT register the server with the backend — after it completes, take
# the printed public key and register the server via the admin panel or
# `POST /api/v1/servers` (see docs/deployment.md).
- name: Provision a VPN exit server
  hosts: vpn_servers
  become: true
  roles:
    - wireguard
    - vpn-agent
    - node-exporter

# Provisions a VLESS Reality exit node end to end: Xray-core + firewall, the xray-agent
# control service, and node_exporter. A separate play/host group from vpn_servers above
# — see docs/vless.md and docs/xray-agent.md. This playbook does NOT register the
# server with the backend either — after it completes, take the printed Reality public
# key and register the server + its VLESS config via the admin panel (see
# docs/deployment.md).
- name: Provision a VLESS Reality exit node
  hosts: vless_servers
  become: true
  roles:
    - xray
    - xray-agent
    - node-exporter
