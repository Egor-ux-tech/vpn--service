[project]
name = "vpn-service-backend"
version = "0.1.0"
description = "VPN service control-plane API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<0.142",
    # Pinned explicitly (not just left to fastapi's own transitive range): the starlette
    # version fastapi would otherwise resolve to has several published CVEs fixed only in
    # 1.0.1+ — see PYSEC-2026-161/248/249/1941/1942/2280/2281. Verified compatible with the
    # fastapi range above via the full test suite (see docs/security.md).
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "redis>=5.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "qrcode[pil]>=7.4",
    "dnspython>=2.6",
    "slowapi>=0.1.9",
    "orjson>=3.10",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "faker>=28.0",
    "fakeredis[lua]>=2.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
