[project]
name = "xray-agent"
version = "0.1.0"
description = "Privileged agent that manages VLESS Reality users on a single Xray-core exit node via its HandlerService gRPC API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<0.142",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "grpcio>=1.66,<2.0",
    "protobuf>=5.27,<6.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "grpcio-tools>=1.66,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/xray_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["app/xray_proto"]

[[tool.mypy.overrides]]
# Machine-generated protobuf/gRPC stubs (see proto/ and docs/xray-agent.md) — not
# hand-written, not meaningfully type-checkable, regenerated via grpc_tools.protoc.
module = "app.xray_proto.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
