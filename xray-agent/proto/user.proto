// Vendored, verbatim from XTLS/Xray-core's common/protocol/user.proto
// (fetched from github.com/XTLS/Xray-core@main — see docs/xray-agent.md's
// "gRPC integration" section for the verification note). Not trimmed.
syntax = "proto3";

package xray.common.protocol;

option go_package = "github.com/xtls/xray-core/common/protocol";

import "typed_message.proto";

// User is a generic user for all protocols.
message User {
  uint32 level = 1;
  string email = 2;

  // Protocol specific account information. Must be the account proto in one of
  // the proxies.
  xray.common.serial.TypedMessage account = 3;
}
