// TRIMMED, wire-compatible subset of XTLS/Xray-core's proxy/vless/account.proto
// (fetched from github.com/XTLS/Xray-core@main — see docs/xray-agent.md's "gRPC
// integration" section for the verification note and why trimming a proto file this
// way is wire-safe). Field numbers 1-3 (id/flow/encryption) are unchanged from the
// original; the original's fields 4-9 (xorMode/seconds/padding/reverse/testpre/
// testseed, the last of which requires importing app/proxyman/config.proto for the
// unused `Reverse` message) are omitted because xray-agent never sets or reads them —
// proto3 treats an omitted field as its zero value on both ends, which is exactly the
// behavior we want (we never want padding/xorMode/reverse-proxy set for a VLESS
// Reality user created here).
syntax = "proto3";

package xray.proxy.vless;

option go_package = "github.com/xtls/xray-core/proxy/vless";

message Account {
  // ID of the account, in the form of a UUID, e.g. "66ad4540-b58c-4ad2-9926-ea63445a9b57".
  string id = 1;
  // Flow settings. "xtls-rprx-vision" for this project — see docs/vless.md.
  string flow = 2;
  string encryption = 3;
}
